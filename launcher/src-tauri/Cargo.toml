[package]
name = "t3sdk-launcher"
version = "0.1.0"
description = "T3SDK Launcher: play, mod and edit maps for Thief: Deadly Shadows"
edition = "2021"
publish = false

[lib]
name = "t3sdk_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
