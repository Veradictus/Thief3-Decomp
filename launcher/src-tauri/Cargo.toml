[package]
name = "t3sdk-launcher"
version = "0.1.0"
description = "T3SDK Launcher: play, mod and edit maps for Thief: Deadly Shadows"
edition = "2021"
publish = false

[lib]
name = "t3sdk_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
# Save backups (saves.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
