# Checks the launcher on every change to it, and builds the Windows installer
# (an artifact of the run).
name: launcher

on:
  push:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: t3sdk-launcher-windows
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
