# Checks and builds the launcher and the SDK on Windows; the files are the
# calling run's artifacts (sdk-bin, launcher-windows). Called by launcher.yml
# for every change and by release.yml for a version tag.
name: launcher build

on:
  workflow_call:
    inputs:
      version:
        description: launcher version (semver, a leading "v" is dropped); empty for a development build
        type: string
        default: ""
    # The updater key (docs/releasing.md). Without it, or without the
    # T3_UPDATER_PUBKEY variable, the launcher is built without the updater.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yarn (Corepack, the version pinned in launcher/package.json)
        run: corepack enable
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: UI (types, lint, format, tests, build)
        working-directory: launcher
        run: |
          yarn install --immutable
          yarn verify
          yarn build
      - name: Backend
        working-directory: launcher/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
      - name: Bundled tools
        run: |
          python3 tools/assets/selftest.py
          python3 tools/stage_launcher.py stage --no-sdk --no-python

  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/sdk.py build
      - name: MSVC for x86 (for the mod template)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Mod template, configured against sdk/include
        working-directory: templates/mod
        run: cmake --preset release "-DT3SDK_INCLUDE_DIR=${{ github.workspace }}/sdk/include"
      - name: Mod template, built and packed
        working-directory: templates/mod
        run: cmake --build --preset package
      - name: Mod template, package validated
        run: python tools/t3mod.py validate (Get-Item templates/mod/build/release/*.t3mod).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-bin
          path: |
            build/sdk/bin/**/*.dll
            build/sdk/bin/**/*.pdb
            build/sdk/bin/T3SDK.ini
            build/sdk/bin/include/**
          if-no-files-found: error

  launcher:
    needs: [check, sdk]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bin
          path: build/sdk/bin
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=${VERSION:-dev-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"
      - name: Stage the tools, the SDK and Python
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The in-app updater needs both halves of the key: the public one
          # (a repository variable) and the private one (a secret, absent in
          # forks and in pull requests from them).
          UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.T3_UPDATER_PUBKEY || '' }}
          UPDATER_ENDPOINT: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          python tools/stage_launcher.py stage ${VERSION:+--version "$VERSION"} \
            ${UPDATER_PUBKEY:+--updater-pubkey "$UPDATER_PUBKEY" --updater-endpoint "$UPDATER_ENDPOINT"}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yarn (Corepack, the version pinned in launcher/package.json)
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Build
        working-directory: launcher
        env:
          # Signs the installer for the updater (its .sig) when the staged
          # config asks for updater artifacts; unused otherwise.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn install --immutable
          yarn tauri build --config src-tauri/bundle/tauri.bundle.conf.json
      - name: Package
        run: |
          mkdir -p dist
          cp launcher/src-tauri/target/release/bundle/nsis/*-setup.exe "dist/T3SDK-Launcher_${{ steps.version.outputs.label }}_x64-setup.exe"
          # The updater's signature of the installer, when it was signed: it
          # signs the bytes, so it stays valid next to the renamed file.
          for sig in launcher/src-tauri/target/release/bundle/nsis/*-setup.exe.sig; do
            if [ -f "$sig" ]; then cp "$sig" "dist/T3SDK-Launcher_${{ steps.version.outputs.label }}_x64-setup.exe.sig"; fi
          done
          python tools/stage_launcher.py portable launcher/src-tauri/target/release/t3sdk-launcher.exe \
            "dist/T3SDK-Launcher_${{ steps.version.outputs.label }}_portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: dist/*
          if-no-files-found: error

