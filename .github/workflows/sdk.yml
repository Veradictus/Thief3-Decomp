# Builds T3SDK (dinput8.dll, the example mod and T3SDK.ini) with MSVC for x86,
# so a build is available without a local Visual Studio. The files are the
# run's artifact, ready to copy into the game's System/ folder.
name: sdk

on:
  push:
    paths: ["sdk/**", "tools/sdk.py", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/**", "tools/sdk.py", ".github/workflows/sdk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/sdk.py build
      - uses: actions/upload-artifact@v4
        with:
          name: t3sdk-windows-x86
          path: |
            build/sdk/bin/**/*.dll
            build/sdk/bin/**/*.pdb
            build/sdk/bin/T3SDK.ini
          if-no-files-found: error
