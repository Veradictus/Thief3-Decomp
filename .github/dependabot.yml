# Weekly dependency updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /launcher
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    # svelte-check and typescript-eslint need TypeScript 6 as `typescript`;
    # TypeScript 7 comes in as `@typescript/native` (svelte-check --tsgo).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /launcher/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories: ["/", "/templates/mod"]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
