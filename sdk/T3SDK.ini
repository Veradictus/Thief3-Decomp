; T3SDK settings. Lives next to dinput8.dll in the game's System folder.
[T3SDK]
; 1 = open a console window that shows T3SDK.log live.
Console=0
; 1 = copy the engine's own log (GLog) into T3SDK.log.
EngineLog=1
; Virtual-key code that writes every live object to T3SDK_objects.txt
; while the game has focus (0x79 = F10, 0 = off).
DumpObjectsKey=0x79
; 1 = add "[Modded - T3SDK <version>]" to the main menu's version line.
MenuVersionLabel=1
; 1 = log main-menu and popup input events (diagnostics).
MenuInputTrace=0

[Fixes]
; 1 = skip the Eidos, Ion Storm, copyright, nVidia and EAX logo movies at start-up.
SkipIntros=1

[Display]
; 1 = offer the monitor's own resolutions in Options > Audio/Video; the highest
; setting is the native resolution (the game only knows 640x480 to 1600x1200).
NativeResolutions=1
; 1 = borderless window covering the monitor instead of exclusive fullscreen:
; alt-tab, other monitors and screenshots work.
Borderless=1
; 1 = lay menus and HUD out for the monitor's aspect ratio instead of stretching 4:3:
; menus stay centered, the HUD moves out to the screen edges.
WidescreenUI=1
; 1 = log where each UI window is placed (for UI modding; T3UI.ini defines them).
UILayoutTrace=0
; 1 = pause while another window has the focus, as the game does on its own.
; 0 = a borderless game keeps running in the background.
PauseInBackground=0
; 1 = move the game world on every frame. The engine moves it only once 10 ms
; have passed, so above 100 fps the world and the camera move on every second
; or third frame and the game looks choppy however high the frame rate is.
SmoothFrames=1
; Highest frame rate, 0 = no limit. The game's own VSynch option (Options >
; Audio/Video, on by default) also works in a borderless window: one frame per
; monitor refresh.
MaxFPS=0
; Size of the menu cursor in a borderless window: 0 = grow with the screen
; height (1x at 768 lines), or a fixed factor such as 1.5.
CursorScale=0
; 1 = log frames per second and the time spent presenting frames, every 10 s.
FrameStats=0
